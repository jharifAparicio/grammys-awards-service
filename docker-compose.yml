services:

  awards-db:
    image: postgres:16-alpine
    container_name: awards-db

    environment:
      POSTGRES_DB: awards_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

  awards-service:
    build:
      context: .
      dockerfile: Dockerfile.dev

    container_name: awards-service

    ports:
      - "8000:8000"

    depends_on:
      - awards-db

    env_file:
      - .env

    volumes:
      - .:/app

volumes:
  postgres_data: