services:

  awards-db:
    image: postgres:16-alpine
    container_name: awards-db

    environment:
      POSTGRES_DB: awards_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d awards_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  awards-service:
    build:
      context: .
      dockerfile: Dockerfile.dev

    container_name: awards-service

    ports:
      - "8000:8000"

    depends_on:
      awards-db:
        condition: service_healthy

    env_file:
      - .env

    volumes:
      - .:/app

volumes:
  postgres_data: